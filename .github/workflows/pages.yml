# 매일 아침 실거래·부동산원 자료를 새로 받아 GitHub Pages 에 배포
name: 데이터 갱신 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 (KST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 키(Secrets)가 없거나 API 오류가 나면 저장소에 있는 snapshot.js 를 그대로 사용
      - name: 최신 자료 받기
        continue-on-error: true
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
        run: node server.mjs --build

      - name: 공개 파일만 모으기
        run: |
          mkdir _site
          cp index.html data.js snapshot.js logo.svg _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
